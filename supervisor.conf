# ADAS ECU Process Supervisor - service configuration
#
# One [service] block per service. Keys:
#   name               unique name (letters, digits, _ and -)        mandatory
#   command            program and arguments (no shell quoting)      mandatory
#   max_restarts       0..10, default 3
#   restart_delay      1..60 seconds, default 2
#   depends_on         comma-separated service names started first
#   user / group       run the service as this user / group (supervisor must run as root)
#   umask              octal file-mode mask for the service, e.g. 027
#   heartbeat_timeout  0..60 seconds, 0 = disabled; the service writes to fd 3
#   mem_limit_kb       log warning W002 above this resident memory, 0 = disabled

[service]
name=camera_service
command=./services/demo_service camera_service
max_restarts=3
restart_delay=2
heartbeat_timeout=5
umask=027
mem_limit_kb=51200

[service]
name=radar_service
command=./services/demo_service radar_service --hang-after 20
max_restarts=3
restart_delay=2
heartbeat_timeout=5

[service]
name=sensor_fusion
command=./services/demo_service sensor_fusion
depends_on=camera_service,radar_service
max_restarts=3
restart_delay=2
heartbeat_timeout=5

[service]
name=lane_assist
command=./services/demo_service lane_assist --crash-after 8
depends_on=sensor_fusion
max_restarts=2
restart_delay=3

# Example with permissions (only applied when the supervisor runs as root):
# [service]
# name=logger_service
# command=./services/demo_service logger_service
# user=adas
# group=adas
# umask=027
